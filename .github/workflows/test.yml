name: Run tests for Move packages
permissions:
  contents: read

env:
  # Known-good Sui CLI version for these examples. Using `latest` occasionally
  # triggers verifier regressions (e.g., dynamic_fields/foreign_types), so pin
  # to a stable release instead of tracking the newest tag.
  VERSION: 'v1.24.1'

on:
  pull_request:

jobs:
  download-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Download Sui
        uses: jaxxstorm/action-install-gh-release@v1.12.0
        with:
          repo: MystenLabs/sui
          platform: ubuntu
          version: ${{ env.VERSION }}
          cache: enable

      # Run the tests in every directory using the latest mainnet binary
      - run: sui move test --path packages/samples
      - run: sui move test --path packages/reference
      - run: sui move test --path packages/todo_list
      - run: sui move test --path packages/hello_world
