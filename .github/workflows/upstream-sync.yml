name: Weekly upstream sync

on:
  schedule:
    - cron: '0 1 * * 1' # Every Monday 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/MystenLabs/move-book.git
          git fetch upstream main

      - name: Merge upstream/main
        run: |
          git checkout main
          git merge upstream/main --no-edit || { echo "::error::Merge conflict detected. Resolve manually."; exit 1; }

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync upstream main"
          branch: automation/upstream-sync
          title: "chore: sync upstream main"
          body: |
            Automated weekly merge from upstream (MystenLabs/move-book).
            - Workflow: .github/workflows/upstream-sync.yml
            - If conflicts occurred, resolve manually and push to this branch.
